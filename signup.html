<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>RIZE Booking - サインアップ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 50px auto; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; }
    .message { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>RIZE Booking サインアップ</h1>
  <input type="text" id="name" placeholder="名前">
  <input type="email" id="email" placeholder="メールアドレス">
  <input type="password" id="password" placeholder="パスワード">
  <button id="signupBtn">登録</button>
  <div class="message" id="message"></div>

  <script>
    // ------------------------------
    // Supabase クライアント作成
    // ------------------------------
    const supabaseUrl = 'https://ryznusedrekdxkbalvqf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlyem51c2VkcmVrZHhrYmFsdnFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5Njk0ODMsImV4cCI6MjA3NDU0NTQ4M30.9fXmFwH7uht15jd-H-jIfIuL0DoIQzmf7FIVgUdyH6E';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // ------------------------------
    // DOM読み込み後にクリック処理
    // ------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const signupBtn = document.getElementById('signupBtn');
      const messageDiv = document.getElementById('message');

      signupBtn.addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          messageDiv.textContent = 'メールアドレスとパスワードは必須です';
          messageDiv.style.color = 'red';
          return;
        }

        // ------------------------------
        // Supabase サインアップ処理
        // ------------------------------
        try {
          const { data, error } = await supabase.auth.signUp(
            { email, password },
            { data: { full_name: name } }
          );

          if (error) {
            messageDiv.textContent = 'エラー: ' + error.message;
            messageDiv.style.color = 'red';
          } else {
            messageDiv.textContent = '確認メールを送信しました。メールを確認してください。';
            messageDiv.style.color = 'green';
          }
        } catch (err) {
          messageDiv.textContent = '予期せぬエラー: ' + err.message;
          messageDiv.style.color = 'red';
        }
      });
    });
  </script>
</body>
</html>
