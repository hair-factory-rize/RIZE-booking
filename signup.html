<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サインアップ</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #f0f0f0; }
    form { background: #fff; padding: 1rem; border-radius: 8px; max-width: 400px; margin: auto; }
    input, button { display: block; width: 100%; margin: 0.5rem 0; padding: 0.5rem; }
    button { background: #0070f3; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005bb5; }
  </style>
</head>
<body>
  <h1>サインアップ</h1>
  <form id="signupForm">
    <input type="email" id="email" placeholder="メールアドレス" required>
    <input type="password" id="password" placeholder="パスワード" required>
    <button type="submit">登録</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script>
    // Supabase 初期化
    const SUPABASE_URL = 'https://xxxx.supabase.co'; // ここを自分の URL に置き換え
    const SUPABASE_ANON_KEY = '公開キーをここに';   // ここを自分の anon key に置き換え
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM が読み込まれたら
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) {
            alert(`エラー: ${error.message}`);
            return;
          }
          alert('登録成功！メールを確認してください。');
          console.log(data);
        } catch (err) {
          console.error(err);
        }
      });
    });

    // 拡張機能やブラウザエラー無視用（コンソールに表示されないように）
    window.addEventListener('error', (e) => { e.stopImmediatePropagation(); }, true);
    window.addEventListener('unhandledrejection', (e) => { e.stopImmediatePropagation(); }, true);
  </script>
</body>
</html>
