<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美容室予約 - ユーザー登録</title>
</head>
<body>
  <h1>ユーザー登録</h1>

  <form id="signup-form">
    <input type="text" id="name" placeholder="名前" required /><br>
    <input type="email" id="email" placeholder="メールアドレス" required /><br>
    <input type="password" id="password" placeholder="パスワード" required /><br>
    <button type="submit">登録</button>
  </form>

  <div id="message"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTi1VH5RTTtgdz4W4wHCVGXJRGUSmdSbE",
      authDomain: "rize-booking.firebaseapp.com",
      projectId: "rize-booking",
      storageBucket: "rize-booking.firebasestorage.app",
      messagingSenderId: "831764174349",
      appId: "1:831764174349:web:43af7e5729672437ea2744",
      measurementId: "G-SKGWPHNZMP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const signupForm = document.getElementById("signup-form");
    const messageDiv = document.getElementById("message");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        // ユーザー登録
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Firestore にユーザー情報保存
        await setDoc(doc(db, "users", user.uid), {
          name: name,
          email: email,
          createdAt: serverTimestamp()
        });

        // メール確認送信
        await sendEmailVerification(user);

        messageDiv.textContent = "登録成功！確認メールを送信しました。";
      } catch (error) {
        messageDiv.textContent = "エラー: " + error.message;
      }
    });
  </script>
</body>
</html>
