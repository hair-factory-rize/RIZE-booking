<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サインアップページ</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
  input { display: block; width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #ccc; }
  button { width: 100%; padding: 0.5rem; border: none; background: #007bff; color: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #0056b3; }
  .error { color: red; margin-bottom: 1rem; }
</style>
</head>
<body>

<form id="signup-form">
  <h2>サインアップ</h2>
  <div class="error" id="error-msg"></div>
  <input type="email" id="email" placeholder="メールアドレス" required>
  <input type="password" id="password" placeholder="パスワード" required>
  <button type="submit">登録</button>
</form>

<!-- Supabase ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
  // Supabase 初期化
  const supabaseUrl = 'https://xxxx.supabase.co'; // あなたの Supabase URL
  const supabaseKey = '公開キー'; // あなたの公開キー
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const form = document.getElementById('signup-form');
  const errorMsg = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const { data, error } = await supabase.auth.signUp({ email, password });

      if (error) {
        errorMsg.textContent = error.message;
      } else {
        alert('登録に成功しました！確認メールを送信しました。');
        form.reset();
      }
    } catch (err) {
      errorMsg.textContent = 'エラーが発生しました。';
      console.error(err);
    }
  });
</script>

</body>
</html>
